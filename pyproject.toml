[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "habits"
version = "0.2.0"
description = "A fast, local-first habit tracker for your terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "David Palma" }]
keywords = ["habit", "tracker", "cli", "productivity", "streak"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
habits = "habits.cli:main"
bwc = "bwc.cli:main"

[project.urls]
Homepage = "https://github.com/davidpalma128/iii"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bwc = ["schema.sql", "templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
